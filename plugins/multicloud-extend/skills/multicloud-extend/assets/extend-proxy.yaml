# Extend proxy: lets pods and Services in your cluster reach the pods that run on your Multicloud pool.
# The agent fills in <pool>, <peering-id>, and the route target <service> and <service-port>
# (see the proxy-manifest steps). The API key is a separate Secret, made in the proxy-secret step.
#
# The namespace multicloud-extend-proxy is never labelled for Liqo offloading.
# GENERATED by scripts/sync-extend-proxy.py from the Multicloud platform manifest. Do not edit.
apiVersion: v1
kind: Namespace
metadata:
  name: multicloud-extend-proxy
  labels:
    app.kubernetes.io/name: extend-proxy
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: extend-proxy
  namespace: multicloud-extend-proxy
  labels: {app.kubernetes.io/name: extend-proxy}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: extend-proxy-config
  namespace: multicloud-extend-proxy
  labels: {app.kubernetes.io/name: extend-proxy}
data:
  config.yaml: |
    pool: <pool>
    peering_id: <peering-id>
    api_url: https://api.multicloud.io
    prefer_ipv6: false
    routes:
      - {listen_port: 8000, namespace: my-apps, service: <service>, port: <service-port>}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: extend-proxy-discovery-multicloud-extend-proxy
  namespace: my-apps
  labels: {app.kubernetes.io/name: extend-proxy}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: extend-proxy-discovery-multicloud-extend-proxy
  namespace: my-apps
  labels: {app.kubernetes.io/name: extend-proxy}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extend-proxy-discovery-multicloud-extend-proxy
subjects:
  - kind: ServiceAccount
    name: extend-proxy
    namespace: multicloud-extend-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extend-proxy
  namespace: multicloud-extend-proxy
  labels: {app.kubernetes.io/name: extend-proxy}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: extend-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: extend-proxy}
    spec:
      serviceAccountName: extend-proxy
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: extend-proxy}
      containers:
        - name: extend-proxy
          image: multicloud/extend-proxy:0.1.2
          args: ["--config=/etc/extend-proxy/config.yaml"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: EXTEND_PROXY_API_KEY
              valueFrom: {secretKeyRef: {name: extend-proxy-api-key, key: key}}
          ports:
            - {name: health, containerPort: 8081}
            - {name: vllm, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/extend-proxy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: extend-proxy-config}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pool
  namespace: multicloud-extend-proxy
  labels: {app.kubernetes.io/name: extend-proxy}
spec:
  selector: {app.kubernetes.io/name: extend-proxy}
  ports:
    - {name: vllm, port: 8000, targetPort: vllm}
